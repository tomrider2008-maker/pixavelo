version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'typescript'
    ignore:
      # typescript-eslint 8.x declares TypeScript support below 6.1.
      - dependency-name: 'typescript'
        versions:
          - '>=6.0.0'
    versioning-strategy: increase

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:30'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 3
