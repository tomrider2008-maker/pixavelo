name: Production release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish this exact revision
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirmation == 'DEPLOY'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PIXAVELO_EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run release:check
      - run: npm run release:artifacts
      - run: npm run release:clean
      - run: npx wrangler pages deploy dist --project-name pixavelo --branch main --commit-dirty=false
      - run: npm run verify:deployment
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-${{ github.sha }}
          path: |
            .artifacts/release/
            .artifacts/operations/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 90
      - if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/escalate-operational-failure.mjs
          --availability release-failed
          --browser not-applicable
